name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Use the version pinned in package.json#packageManager (pnpm@...)

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # vite.config.js can infer base from GITHUB_REPOSITORY, but keep this explicit
          # so local/CI behavior stays predictable.
          BASE_URL: ${{ github.repository == format('{0}/{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
          # Optional: external proxy for CORS-restricted sources (kmoni/palert/msil, etc.)
          # Set this in repo Settings -> Secrets and variables -> Actions -> Variables.
          VITE_EDGE_PROXY_BASE: ${{ vars.VITE_EDGE_PROXY_BASE }}
        run: pnpm -s build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
